:root{
  color-scheme:light;
  --bg:#f5f3eb;--surface:#fffefa;--surface-2:#eeeee4;--surface-3:#e4e8dc;
  --ink:#20352d;--muted:#68766c;--green:#12513f;--green-dark:#0b392e;--green-soft:#e1eee5;
  --gold:#b18a43;--gold-light:#e6d5a9;--border:#dedfd3;
  --shadow:0 12px 35px rgba(22,51,39,.075);--radius:20px;--radius-sm:13px;
  --urdu:"Noto Nastaliq Urdu",serif;--arabic:"Noto Naskh Arabic",serif;--sans:"Inter",system-ui,sans-serif;
  --c0:#24765a;--c1:#b88e49;--c2:#6d9e7e;--c3:#2f6f8f;--c4:#a45b4d;--c5:#7a6aa8;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--bg:#101b17;--surface:#192721;--surface-2:#23342b;--surface-3:#2c4035;
    --ink:#f1f0e7;--muted:#b1bdb3;--green:#8bc5a2;--green-dark:#102a21;--green-soft:#263c30;
    --gold:#e0bd70;--gold-light:#6b5934;--border:#39483e;--shadow:0 12px 35px rgba(0,0,0,.24)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--urdu);font-size:15px;line-height:2.15;padding-bottom:110px}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{width:min(100% - 28px,760px);margin:auto}
#app.en,#app.ro{font-family:var(--sans);line-height:1.7}
#app.ar{font-family:var(--arabic);line-height:2.05}
.number{font-family:var(--sans);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.arabic{font-family:var(--arabic);font-size:22px;line-height:2.1;text-align:right;direction:rtl}
.hero{position:relative;overflow:hidden;margin:calc(18px + env(safe-area-inset-top,0px)) 0 25px;padding:24px 20px 27px;border-radius:26px;background:linear-gradient(135deg,#103e31,#155c43 65%,#0e392f);color:#fffdf3;box-shadow:0 18px 42px rgba(10,54,39,.2)}
.hero::before{content:"";position:absolute;inset:0;opacity:.12;pointer-events:none;background-image:repeating-linear-gradient(45deg,transparent 0 24px,#e4d09b 25px 26px,transparent 27px 48px),repeating-linear-gradient(-45deg,transparent 0 24px,#e4d09b 25px 26px,transparent 27px 48px);-webkit-mask-image:linear-gradient(120deg,black,transparent 80%);mask-image:linear-gradient(120deg,black,transparent 80%)}
.hero-content{position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:27px}
.logo{width:48px;height:48px;border:1px solid rgba(230,213,169,.65);border-radius:15px;display:grid;place-items:center;color:#e8cf91;font-family:var(--arabic);font-size:24px;line-height:1}
.lang-switch{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.14);border-radius:12px}
.lang-switch button{min-height:34px;padding:3px 10px;border:0;border-radius:8px;background:transparent;color:#e3eae1;font-size:12px;font-family:inherit;line-height:1.4}
.lang-switch button[aria-pressed="true"]{background:#e8d6a9;color:#173c2e;font-weight:700}
.eyebrow{color:#e8d6a9;font-size:12px;letter-spacing:.5px}
.hero h1{margin:3px 0 4px;font-size:clamp(29px,7vw,42px);font-weight:700;line-height:1.9}
#app.en .hero h1,#app.ro .hero h1{line-height:1.3}
.english-name{color:#e6d5a9;font-family:var(--sans);font-size:12px;letter-spacing:2px;font-weight:600;direction:ltr;text-align:start}
.hero-rule{width:48px;height:2px;background:#d9b86d;margin-top:17px}
.demo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;padding:11px 14px;border-radius:13px;background:var(--gold-light);color:var(--ink);font-size:12.5px;line-height:1.9}
.link{background:none;border:0;color:var(--green);text-decoration:underline;font-weight:700;padding:4px}
.section-heading{display:flex;align-items:center;gap:12px;margin:32px 3px 15px}
.section-number{width:39px;height:39px;flex:0 0 39px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--green);font-family:var(--sans);font-size:14px;font-weight:700;line-height:1}
.section-heading h2{font-size:19px;line-height:1.9;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card-title{margin:0 0 6px;font-size:15px}
.gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gender-option{min-height:112px;padding:14px 8px;border-radius:17px;border:1.5px solid var(--border);background:var(--surface);text-align:center;color:var(--ink);transition:.2s ease}
.gender-option.selected{border-color:var(--gold);background:var(--green-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.gender-icon{display:block;font-size:30px;line-height:1.5;margin-bottom:5px}
.gender-option strong{font-size:16px}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:600}
.field input{width:100%;height:50px;padding:10px 13px;border:1px solid var(--border);border-radius:12px;outline:none;background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:15px;direction:ltr;text-align:left}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(177,138,67,.15)}
.field small{display:block;color:var(--muted);font-family:var(--sans);font-size:11px;margin-top:5px;min-height:1em;direction:ltr;text-align:start}
.group-title{display:flex;align-items:center;justify-content:space-between;margin:23px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700}
.group-title:first-child{margin-top:0}
details.far{margin-top:20px;border:1px dashed var(--border);border-radius:14px;padding:2px 14px}
details.far summary{cursor:pointer;font-weight:700;font-size:15px;padding:10px 0}
details.far .hint{color:var(--muted);font-size:12px;margin:0 0 6px}
.heir-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;border-bottom:1px solid var(--border)}
.heir-row:last-child{border-bottom:0}
.heir-name{font-size:14px}
.heir-row.on .heir-name{font-weight:700;color:var(--green)}
.stepper{display:flex;align-items:center;gap:11px;background:var(--surface-2);padding:4px;border-radius:12px}
.stepper button{width:38px;height:38px;min-width:38px;border:0;border-radius:9px;background:var(--surface);color:var(--green);font-family:var(--sans);font-size:20px;font-weight:600;line-height:1}
.stepper .count{min-width:20px;text-align:center;font-weight:700}
.result-hero{background:linear-gradient(145deg,#0c3b2e,#176047);color:#fff;border-radius:22px;padding:24px 20px;box-shadow:var(--shadow);text-align:center;position:relative;overflow:hidden}
.result-hero .label{color:#e4d5ae;font-size:13px}
.result-hero .amount{font-family:var(--sans);font-size:clamp(26px,8vw,36px);font-weight:800;letter-spacing:-1px;direction:ltr;margin:5px 0}
.result-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.result-summary div{padding:10px;border-radius:12px;background:rgba(255,255,255,.1)}
.result-summary small{display:block;color:#d7e5db;font-size:11px;line-height:1.8}
.result-summary strong{font-family:var(--sans);font-size:14px;direction:ltr;unicode-bidi:isolate;display:block}
.warnbox{margin-top:12px;padding:11px 13px;border-radius:11px;background:#f6e4df;color:#7a3328;font-size:12.5px;line-height:1.9}
.parts{color:var(--muted);font-size:12.5px;margin:18px 2px 10px}
.share-bar{display:flex;width:100%;height:13px;border-radius:20px;overflow:hidden;background:var(--surface-2);direction:ltr;gap:2px}
.share-bar span{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin:11px 0 6px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.heir-card{padding:0;overflow:hidden;margin-top:14px}
.heir-card-top{display:flex;justify-content:space-between;align-items:center;padding:16px;gap:10px}
.heir-card-top h3{margin:0;font-size:16px}
.cnt{color:var(--muted);font-family:var(--sans);font-size:.8em}
.fraction{text-align:center;background:var(--green-soft);color:var(--green);border-radius:12px;padding:7px 13px;font-family:var(--sans);font-weight:800;font-size:20px;direction:ltr;min-width:66px}
.heir-data{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 13px 14px}
.heir-data div{background:var(--surface-2);border-radius:10px;padding:9px 5px;text-align:center}
.heir-data small{display:block;color:var(--muted);font-size:11px;line-height:1.8}
.heir-data strong{font-family:var(--sans);font-size:13px;direction:ltr;unicode-bidi:isolate;display:block}
.type-tag{display:inline-block;padding:0 10px;border-radius:20px;font-size:11px;font-weight:700;line-height:1.9}
.tag-fard{background:#e5eee1;color:#20583a}
.tag-asaba{background:#f2e9d4;color:#73511b}
.tag-radd{background:#e9e3f3;color:#5c4386}
.daleel{padding:14px 15px;border-top:1px solid var(--border)}
.daleel-heading{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;margin-bottom:9px}
.daleel-heading::before{content:"";width:4px;height:17px;border-radius:5px;background:currentColor}
.daleel-quran{background:rgba(31,110,72,.055)}
.daleel-quran .daleel-heading{color:#36845b}
.daleel-hadith{background:rgba(177,138,67,.09)}
.daleel-hadith .daleel-heading{color:#a37c37}
.daleel-ijma{background:rgba(94,75,139,.075)}
.daleel-ijma .daleel-heading{color:#8270b3}
.daleel .arabic{font-size:20px;color:var(--ink);margin:0 0 8px}
.translation{font-family:var(--urdu);font-size:13px;line-height:2.3;margin:5px 0;direction:rtl;text-align:right}
.source{color:var(--muted);font-family:var(--urdu);font-size:11px;line-height:1.9;margin-top:7px;direction:rtl;text-align:right}
.card ul{margin:8px 0 0;padding-inline-start:20px;font-size:13px;line-height:2}
.blocked-list{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.blocked-item{padding:11px 13px;background:var(--surface-2);border-radius:11px;font-size:13px;line-height:1.9}
.blocked-item b{display:block}
.blocked-item span{color:#a45b4d;font-size:12px}
.table-wrap{overflow-x:auto;margin-top:10px}
.tashih-table{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}
.tashih-table th{background:var(--green);color:#fff;font-weight:600}
.tashih-table th,.tashih-table td{padding:10px 7px;border:1px solid var(--border)}
.tashih-table td:not(:first-child){font-family:var(--sans);direction:ltr}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:6px}
.btn{min-height:49px;padding:9px 5px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-size:12.5px;font-weight:600;text-align:center;line-height:1.6}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#172e22}
.btn:active,.gender-option:active{transform:scale(.97)}
#cstatus{grid-column:1/-1;font-size:12px;color:var(--muted);min-height:1em}
#copybox{width:100%;height:120px;margin-top:10px;border-radius:12px;border:1px solid var(--border);padding:10px;background:var(--surface-2);color:var(--ink)}
.footer{margin:30px 0 15px;padding:23px 15px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:12px;line-height:2}
.footer p{margin:0 0 12px}
.footer strong,.footer b{color:var(--ink)}
.footer a{color:var(--green);text-decoration:underline;text-underline-offset:4px}
.sticky-bar{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:12px 15px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sticky-inner{max-width:730px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sticky-info{font-size:11.5px;line-height:1.7}
.sticky-info strong{display:block;font-family:var(--sans);font-size:15px;direction:ltr;text-align:start}
.sticky-inner .btn{min-width:150px}
@media (min-width:600px){#app{width:min(100% - 48px,760px)}.hero{padding:30px}.card{padding:22px}.heir-card{padding:0}}
@media (max-width:390px){#app{width:calc(100% - 22px)}.hero{padding:19px 16px 22px}.lang-switch button{padding:3px 7px;font-size:11px}.input-grid{grid-template-columns:1fr}.card{padding:15px}.heir-card{padding:0}.sticky-inner .btn{min-width:120px}}
@media (prefers-color-scheme:dark){.warnbox{background:#4a2a24;color:#f3cfc7}.tag-fard{background:#24402f;color:#a9d8bb}.tag-asaba{background:#463b21;color:#e8cf91}.tag-radd{background:#38304f;color:#cbbdf0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--surface-2:#f5f5f5;--ink:#17251d;--muted:#555;--border:#ddd}
  body{background:#fff;padding:0}
  .sticky-bar,.lang-switch,.actions,.demo,.pre,details.far,#copybox{display:none!important}
  .hero,.result-hero{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .card,.heir-card{box-shadow:none;break-inside:avoid}
  #app{width:100%;max-width:none}
}

/* =========================================
   I'ZAZ AL-MIRATH — PREMIUM 3D DESIGN LAYER
========================================= */

:root {
  --depth-shadow:
    0 12px 25px rgba(18, 55, 40, .10),
    0 4px 8px rgba(18, 55, 40, .06),
    inset 0 1px 0 rgba(255,255,255,.8);

  --gold-glow:
    0 0 22px rgba(207, 169, 91, .22);
}

/* 3D HERO */
.hero {
  background:
    radial-gradient(
      circle at 85% 15%,
      rgba(225, 191, 115, .24),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #092d24 0%,
      #12533e 48%,
      #1d7050 100%
    );

  box-shadow:
    0 22px 45px rgba(7, 42, 30, .28),
    0 8px 15px rgba(7, 42, 30, .16),
    inset 0 1px 1px rgba(255,255,255,.22),
    inset 0 -8px 20px rgba(0,0,0,.12);
}

/* 3D LOGO */
.logo {
  background: linear-gradient(
    145deg,
    #f0d99f,
    #b88c43 55%,
    #805d29
  );

  color: #173d2d;

  border: 1px solid #f5e5b9;

  box-shadow:
    0 7px 14px rgba(0,0,0,.22),
    inset 0 2px 3px rgba(255,255,255,.65),
    inset 0 -3px 5px rgba(80,50,10,.2);

  text-shadow: 0 1px 1px rgba(255,255,255,.4);
}

/* FLOATING CARDS */
.card {
  position: relative;

  box-shadow:
    0 10px 25px rgba(22, 51, 39, .065),
    0 3px 7px rgba(22, 51, 39, .04),
    inset 0 1px 0 rgba(255,255,255,.65);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}

.card:hover {
  transform: translateY(-3px);

  box-shadow:
    0 18px 35px rgba(22, 51, 39, .12),
    0 5px 12px rgba(22, 51, 39, .06);
}

/* 3D GENDER CARDS */
.gender-option {
  box-shadow:
    0 5px 12px rgba(0,0,0,.045),
    inset 0 1px 0 rgba(255,255,255,.8);

  transition: all .25s ease;
}

.gender-option:hover {
  transform: translateY(-4px);

  box-shadow:
    0 12px 22px rgba(18, 81, 63, .13);
}

.gender-option.selected {
  background: linear-gradient(
    145deg,
    var(--green-soft),
    var(--surface)
  );

  box-shadow:
    0 8px 20px rgba(177,138,67,.16),
    inset 0 1px 3px rgba(255,255,255,.8),
    inset 0 -2px 5px rgba(177,138,67,.12);
}

/* 3D STEPPER */
.stepper {
  box-shadow:
    inset 2px 3px 6px rgba(0,0,0,.07),
    inset -2px -2px 5px rgba(255,255,255,.35);
}

.stepper button {
  box-shadow:
    0 4px 7px rgba(0,0,0,.09),
    inset 0 1px 1px rgba(255,255,255,.9);

  transition: all .15s ease;
}

.stepper button:active {
  transform: translateY(3px);

  box-shadow:
    inset 0 3px 6px rgba(0,0,0,.16);
}

/* 3D INPUT FIELDS */
.field input {
  box-shadow:
    inset 2px 3px 6px rgba(0,0,0,.045),
    0 1px 0 rgba(255,255,255,.5);

  transition: all .2s ease;
}

.field input:focus {
  transform: translateY(-1px);

  box-shadow:
    0 0 0 3px rgba(177,138,67,.15),
    0 5px 12px rgba(177,138,67,.09);
}

/* PREMIUM RESULT HERO */
.result-hero {
  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(227,192,115,.23),
      transparent 55%
    ),
    linear-gradient(
      145deg,
      #092f25,
      #155c43 55%,
      #0a392d
    );

  box-shadow:
    0 22px 40px rgba(8,53,37,.25),
    0 7px 14px rgba(8,53,37,.15),
    inset 0 1px 1px rgba(255,255,255,.2),
    inset 0 -8px 20px rgba(0,0,0,.15);
}

.result-hero .amount {
  color: #f2d99e;

  text-shadow:
    0 3px 12px rgba(0,0,0,.25),
    0 0 20px rgba(225,190,105,.18);
}

.result-summary div {
  border: 1px solid rgba(255,255,255,.12);

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.12),
    0 4px 10px rgba(0,0,0,.09);

  backdrop-filter: blur(8px);
}

/* SHARE BAR DEPTH */
.share-bar {
  height: 16px;

  padding: 2px;

  border: 1px solid var(--border);

  box-shadow:
    inset 0 3px 6px rgba(0,0,0,.13),
    0 2px 4px rgba(255,255,255,.4);
}

.share-bar span {
  border-radius: 10px;

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.25),
    inset 0 -2px 3px rgba(0,0,0,.12);
}

/* 3D HEIR CARDS */
.heir-card {
  overflow: hidden;

  box-shadow:
    0 9px 22px rgba(22,51,39,.075),
    inset 0 1px 0 rgba(255,255,255,.6);
}

.heir-card-top {
  background: linear-gradient(
    145deg,
    var(--surface),
    var(--surface-2)
  );
}

.fraction {
  box-shadow:
    0 5px 12px rgba(18,81,63,.10),
    inset 0 1px 2px rgba(255,255,255,.7);
}

/* 3D TYPE TAGS */
.type-tag {
  box-shadow:
    0 2px 5px rgba(0,0,0,.08),
    inset 0 1px 1px rgba(255,255,255,.5);
}

/* 3D DALEEL PANELS */
.daleel {
  position: relative;

  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.025);
}

.daleel-quran {
  border-right: 3px solid #36845b;
}

.daleel-hadith {
  border-right: 3px solid #b18a43;
}

.daleel-ijma {
  border-right: 3px solid #8270b3;
}

/* BUTTONS */
.btn {
  box-shadow:
    0 5px 10px rgba(0,0,0,.07),
    inset 0 1px 1px rgba(255,255,255,.5);

  transition: all .2s ease;
}

.btn-primary {
  background: linear-gradient(
    145deg,
    #1b7050,
    #105039
  );

  box-shadow:
    0 7px 15px rgba(16,80,57,.24),
    inset 0 1px 1px rgba(255,255,255,.25);
}

.btn-gold {
  background: linear-gradient(
    145deg,
    #e3c77f,
    #b18a43
  );

  box-shadow:
    0 7px 15px rgba(177,138,67,.22),
    inset 0 1px 1px rgba(255,255,255,.5);
}

.btn:active {
  transform: translateY(3px) scale(.98);

  box-shadow:
    inset 0 3px 7px rgba(0,0,0,.15);
}

/* STICKY GLASS ACTION BAR */
.sticky-bar {
  background: color-mix(
    in srgb,
    var(--surface) 85%,
    transparent
  );

  backdrop-filter: blur(20px);

  box-shadow:
    0 -8px 25px rgba(0,0,0,.06);
}

/* DARK MODE 3D */
@media (prefers-color-scheme: dark) {

  :root {
    --depth-shadow:
      0 12px 28px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.045);
  }

  .card,
  .heir-card {
    box-shadow:
      0 12px 25px rgba(0,0,0,.24),
      inset 0 1px 0 rgba(255,255,255,.045);
  }

  .gender-option {
    box-shadow:
      0 5px 12px rgba(0,0,0,.2),
      inset 0 1px 0 rgba(255,255,255,.04);
  }

  .gender-option.selected {
    box-shadow:
      0 0 0 1px var(--gold),
      0 8px 20px rgba(0,0,0,.25);
  }

  .stepper button {
    box-shadow:
      0 4px 8px rgba(0,0,0,.25),
      inset 0 1px 1px rgba(255,255,255,.07);
  }

  .fraction {
    box-shadow:
      0 5px 12px rgba(0,0,0,.2),
      inset 0 1px 1px rgba(255,255,255,.06);
  }

  .daleel-quran {
    background: rgba(54,132,91,.12);
  }

  .daleel-hadith {
    background: rgba(177,138,67,.12);
  }

  .daleel-ijma {
    background: rgba(130,112,179,.12);
  }
}

/* ACCESSIBILITY */
@media (prefers-reduced-motion: reduce) {
  .card,
  .gender-option,
  .btn,
  .stepper button {
    transition: none !important;
    transform: none !important;
  }
}

<script>
/*CALC-START*/
const KEYS=['husband','wife','son','dau','gson','gdau','father','mother','gfather','gmotherP','gmotherM','fbro','fsis','cbro','csis','ubro','usis','fbroSon','cbroSon','funcle','cuncle','funcleSon'];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d=1)=>{const g=gcd(n,d)||1;return{n:n/g,d:d/g};};
const add=(a,b)=>fr(a.n*b.d+b.n*a.d,a.d*b.d);
const sub=(a,b)=>fr(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>fr(a.n*b.n,a.d*b.d);
const dv=(a,b)=>fr(a.n*b.d,a.d*b.n);
const ZERO=fr(0,1),ONE=fr(1,1);
const fs=f=>f.n+'/'+f.d;

function calc(n0,sex){
  const n={...n0};
  if(sex==='M')n.husband=0;else n.wife=0;
  const P=k=>(n[k]||0)>0;
  const blocked={};
  const B=(ks,why)=>ks.forEach(k=>{if(P(k)&&!blocked[k])blocked[k]=why;});
  const A=k=>P(k)&&!blocked[k];
  const c=k=>A(k)?n[k]:0;
  const notes=[];
  const sibs=['fbro','fsis','cbro','csis','ubro','usis'];
  const remote=['fbroSon','cbroSon','funcle','cuncle','funcleSon'];
  const desc=P('son')||P('dau')||P('gson')||P('gdau');
  const maleDesc=P('son')||P('gson');
  const femaleDesc=P('dau')||P('gdau');
  const sibTotal=sibs.reduce((s,k)=>s+(n[k]||0),0);

  /* hajb: who is excluded by whom */
  if(P('son'))B(['gson','gdau'],'son');
  if(n.dau>=2&&!P('gson'))B(['gdau'],'twoDau');
  if(maleDesc)B(['fbro','fsis','cbro','csis',...remote],'maleDesc');
  if(desc)B(['ubro','usis'],'desc');
  if(P('father'))B(['gfather','gmotherP',...sibs,...remote],'father');
  if(!P('father')&&P('gfather'))B([...sibs,...remote],'gfather');
  if(P('mother'))B(['gmotherP','gmotherM'],'mother');
  const fsisMag=A('fsis')&&!A('fbro')&&femaleDesc;
  if(A('fbro'))B(['cbro','csis'],'fbro');
  if(fsisMag)B(['cbro','csis'],'fsisMag');
  if(A('fsis')&&!A('fbro')&&!fsisMag&&n.fsis>=2&&!A('cbro'))B(['csis'],'twoFsis');

  /* ashab-ul-furud */
  const F={},kind={};
  const setF=(k,f)=>{F[k]=f;kind[k]='f';};
  if(sex==='F'&&A('husband')){const f=desc?fr(1,4):fr(1,2);setF('husband',f);notes.push({c:'spouse',p:{who:'husband',f:fs(f),desc}});}
  if(sex==='M'&&A('wife')){const f=desc?fr(1,8):fr(1,4);setF('wife',f);notes.push({c:'spouse',p:{who:'wife',f:fs(f),desc}});}
  if(A('mother')){
    if(desc||sibTotal>=2){setF('mother',fr(1,6));notes.push({c:'mother6',p:{why:desc?'desc':'sibs'}});}
    else{
      const alive=KEYS.filter(A);
      const onlyCore=alive.every(k=>['husband','wife','father','mother'].includes(k));
      if(onlyCore&&A('father')&&(A('husband')||A('wife'))){
        const sp=F.husband||F.wife;
        setF('mother',mul(sub(ONE,sp),fr(1,3)));
        notes.push({c:'umar'});
      }else setF('mother',fr(1,3));
    }
  }
  const fa=A('father')?'father':(A('gfather')?'gfather':null);
  if(fa){
    if(maleDesc){setF(fa,fr(1,6));notes.push({c:'fa6'});}
    else if(femaleDesc){setF(fa,fr(1,6));notes.push({c:'faA'});}
    else notes.push({c:'faO'});
  }
  if(A('dau')&&!A('son'))setF('dau',n.dau===1?fr(1,2):fr(2,3));
  if(A('gdau')&&!A('gson')){
    if(n.dau===0)setF('gdau',n.gdau===1?fr(1,2):fr(2,3));
    else if(n.dau===1)setF('gdau',fr(1,6));
  }
  if(A('fsis')&&!A('fbro')&&!fsisMag)setF('fsis',n.fsis===1?fr(1,2):fr(2,3));
  const csisMag=A('csis')&&!A('cbro')&&!A('fsis')&&femaleDesc;
  if(A('csis')&&!A('cbro')&&!csisMag){
    if(A('fsis')){if(n.fsis===1)setF('csis',fr(1,6));}
    else setF('csis',n.csis===1?fr(1,2):fr(2,3));
  }
  const uc=c('ubro')+c('usis');
  if(uc>0){
    const tot=uc===1?fr(1,6):fr(1,3);
    if(c('ubro'))setF('ubro',mul(tot,fr(c('ubro'),uc)));
    if(c('usis'))setF('usis',mul(tot,fr(c('usis'),uc)));
  }
  const gm=['gmotherP','gmotherM'].filter(A);
  gm.forEach(k=>setF(k,fr(1,6*gm.length)));

  let sum=ZERO;for(const k in F)sum=add(sum,F[k]);
  const R=sub(ONE,sum);

  /* asaba: the first group in order takes the residue */
  let units=[];
  if(A('son'))units=[['son',2],['dau',1]];
  else if(A('gson'))units=[['gson',2],['gdau',1]];
  else if(fa&&!maleDesc)units=[[fa,1]];
  else if(A('fbro'))units=[['fbro',2],['fsis',1]];
  else if(fsisMag)units=[['fsis',1]];
  else if(A('cbro'))units=[['cbro',2],['csis',1]];
  else if(csisMag)units=[['csis',1]];
  else{for(const k of remote){if(A(k)){units=[[k,1]];break;}}}
  units=units.filter(([k])=>A(k));

  const final={},how={};
  if(sum.n>sum.d){
    for(const k in F){final[k]=dv(F[k],sum);how[k]='f';}
    notes.push({c:'aul',p:{f:fs(sum)}});
    units.forEach(([k])=>{if(!final[k])blocked[k]='noResidue';});
  }else{
    for(const k in F){final[k]=F[k];how[k]='f';}
    if(units.length){
      if(R.n>0){
        const tu=units.reduce((s,[k,u])=>s+n[k]*u,0);
        units.forEach(([k,u])=>{
          final[k]=add(final[k]||ZERO,mul(R,fr(n[k]*u,tu)));
          how[k]=F[k]?'fa':'a';
        });
      }else units.forEach(([k])=>{if(!final[k])blocked[k]='noResidue';});
    }else if(R.n>0){
      const sp=['husband','wife'].filter(k=>F[k]);
      const others=Object.keys(F).filter(k=>!sp.includes(k));
      if(others.length){
        let os=ZERO;others.forEach(k=>{os=add(os,F[k]);});
        let ss=ZERO;sp.forEach(k=>{ss=add(ss,F[k]);});
        const pool=sub(ONE,ss);
        others.forEach(k=>{final[k]=mul(dv(F[k],os),pool);how[k]='r';});
        notes.push({c:'radd'});
      }else if(sp.length){
        final[sp[0]]=ONE;how[sp[0]]='r';notes.push({c:'raddSpouse'});
      }
    }
  }
  KEYS.forEach(k=>{
    if(A(k)&&!(final[k]&&final[k].n>0)&&!blocked[k])blocked[k]=units.length?'nearer':'noResidue';
  });
  const rows=KEYS.filter(k=>final[k]&&final[k].n>0).map(k=>({k,count:n[k],share:final[k],how:how[k]}));
  const N=rows.reduce((l,r)=>l/gcd(l,r.share.d)*r.share.d,1);
  rows.forEach(r=>{r.parts=r.share.n*(N/r.share.d);});
  const blockedList=KEYS.filter(k=>P(k)&&blocked[k]).map(k=>({k,why:blocked[k]}));
  const anyHeir=KEYS.some(P);
  if(!rows.length)notes.push({c:'noHeirs'});
  return{rows,N,blocked:blockedList,notes,empty:!rows.length,anyHeir};
}
/*CALC-END*/

  spouse:p=>p.who==='husband'?`شوہر کا حصہ ${p.f}: ${p.desc?'مرحومہ کی اولاد موجود ہے':'مرحومہ کی کوئی اولاد نہیں'}۔`:`بیوی (بیویوں) کا کل حصہ ${p.f}: ${p.desc?'مرحوم کی اولاد موجود ہے':'مرحوم کی کوئی اولاد نہیں'}۔`,
  mother6:p=>p.why==='desc'?'والدہ کو 1/6: مرحوم کی اولاد موجود ہے۔':'والدہ کو 1/6: دو یا زیادہ بھائی بہن موجود ہیں (چاہے انہیں حصہ نہ ملے)۔',
  umar:()=>'والدہ کو زوج کا حصہ نکالنے کے بعد باقی کا 1/3، کیونکہ صرف والدین اور زوج وارث ہیں۔',
  fa6:()=>'والد (یا دادا) کو 1/6: بیٹا یا پوتا موجود ہے۔',
  faA:()=>'والد (یا دادا) کو 1/6 اور بچی ہوئی رقم بھی عصبہ کے طور پر، کیونکہ صرف بیٹی یا پوتی ہے۔',
  faO:()=>'والد (یا دادا) عصبہ ہیں: فرض حصوں کے بعد باقی سب انہیں ملتا ہے۔',
  aul:p=>`حصوں کا مجموعہ ${p.f} (ایک سے زیادہ) تھا، اس لیے "عول" کے تحت سب حصے یکساں نسبت سے کم کیے گئے۔`,
  radd:()=>'حصے پورے نہ ہونے سے بچی ہوئی رقم زوج کے سوا باقی فرض والوں کو ان کے حصوں کے تناسب سے واپس (ردّ) کی گئی۔',
  raddSpouse:()=>'کوئی اور وارث نہ ہونے سے باقی رقم بھی زوج کو دی گئی۔',
  noHeirs:()=>'کوئی وارث نہیں چنا گیا۔ اس صورت میں ذوی الارحام یا بیت المال کا مسئلہ ہوتا ہے، کسی عالم سے پوچھیں۔'
 }}
};

const PROJ={
ur:['پروجیکٹ','مفتی سردار محمد جدون الاشرفی','بانی و مہتمم جامعۃ الإعزاز، ملک آباد گدون، ٹوپی، صوابی، خیبر پختونخوا، پاکستان'],
ar:['مشروع','مفتي سردار محمد جدون الأشرفي','مؤسس ومدير جامعة الإعزاز، ملك آباد جدون، توپي، صوابي، خيبر بختونخوا، باكستان'],
en:['A project of','Mufti Sardar Muhammad Jadoon Al-Ashrafi','Founder & Director, Jamia Al-I\'zaz, Malik Abad Gadoon, Topi, Swabi, Khyber Pakhtunkhwa, Pakistan'],
ro:['Project','Mufti Sardar Muhammad Jadoon Al-Ashrafi','Bani o Muhtamim, Jamia Al-I\'zaz, Malik Abad Gadoon, Topi, Swabi, Khyber Pakhtunkhwa, Pakistan']};
const DEVN={ur:'مفتی اویس رحمان جدون',ar:'مفتي أويس رحمان جدون',en:'Mufti Awais Rahman Jadoon',ro:'Mufti Awais Rahman Jadoon'};
const DEV={ro:'Developer',en:'Developed by',ur:'ڈیولپر',ar:'المطوّر'};
const KICK={ro:'Ilm-ul-Faraid',en:'Ilm al-Faraid',ur:'علم الفرائض',ar:'علم الفرائض'};
const $=s=>document.querySelector(s);
const app=$('#app');
const MAXN={husband:1,wife:4,father:1,mother:1,gfather:1,gmotherP:1,gmotherM:1};
const GROUPS=[['spouse',['husband','wife']],['children',['son','dau','gson','gdau']],['parents',['father','mother','gfather','gmotherP','gmotherM']],['sibs',['fbro','fsis','cbro','csis','ubro','usis']],['far',['fbroSon','cbroSon','funcle','cuncle','funcleSon']]];
const blankN=()=>Object.fromEntries(KEYS.map(k=>[k,0]));
const S={lang:'ro',sex:'M',demo:true,estate:12000000,funeral:100000,debts:500000,will:0,n:{...blankN(),wife:1,son:2,dau:1,father:1,mother:1}};
try{const l=localStorage.getItem('miras-lang');if(l&&T[l])S.lang=l;}catch(e){}
const nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const fmt=x=>'Rs '+nf.format(Math.round(x));
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const LET={
ur:{n:'جامعۃ الاعزاز، ملک آباد گدون',a:'ملک آباد گدون، ٹوپی، صوابی، خیبر پختونخوا، پاکستان',r:'بانی و مہتمم',m:'مفتی سردار محمد جدون الاشرفی',d:'تاریخ',loc:'ur-PK'},
ar:{n:'جامعة الإعزاز',a:'ملك آباد جدون، توپي، صوابي، خيبر بختونخوا، باكستان',r:'المؤسس والمدير',m:'المفتي سردار محمد جدون الأشرفي',d:'التاريخ',loc:'ar'},
en:{n:"Jamia Al-I'zaz",a:'Malik Abad Gadoon, Topi, Swabi, Khyber Pakhtunkhwa, Pakistan',r:'Founder & Director',m:'Mufti Sardar Muhammad Jadoon Al-Ashrafi',d:'Date',loc:'en-GB'},
ro:{n:"Jamia Al-I'zaz",a:'Malik Abad Gadoon, Topi, Swabi, Khyber Pakhtunkhwa, Pakistan',r:'Bani o Muhtamim',m:'Mufti Sardar Muhammad Jadoon Al-Ashrafi',d:'Tareekh',loc:'en-GB'}};
function stampDate(){
  const L=LET[S.lang];let d='';
  try{d=new Date().toLocaleDateString(L.loc,{day:'numeric',month:'long',year:'numeric'});}catch(e){d=new Date().toDateString();}
  document.querySelectorAll('.lh-date').forEach(el=>{el.textContent=L.d+': '+d;});
}
window.addEventListener('beforeprint',stampDate);
function rowHTML(k){
  const t=T[S.lang];
  return `<div class="heir-row${S.n[k]>0?' on':''}" id="r-${k}"><span class="heir-name">${t.k[k]}</span><span class="stepper"><button type="button" data-act="step" data-k="${k}" data-d="-1" aria-label="${t.minus}: ${esc(t.k[k])}">−</button><span class="count number" id="v-${k}">${S.n[k]}</span><button type="button" data-act="step" data-k="${k}" data-d="1" aria-label="${t.plus}: ${esc(t.k[k])}">+</button></span></div>`;
}
function fldHTML(id,label){
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" data-num="1" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="${S[id]||''}"><small id="h-${id}">${S[id]?fmt(S[id]):''}</small></div>`;
}
function heading(num,title,cls){
  return `<div class="section-heading${cls?' '+cls:''}"><div class="section-number">${num}</div><div><h2>${title}</h2></div></div>`;
}
function render(){
  const t=T[S.lang],x2=X[S.lang];
  app.className='app '+S.lang;app.dir=t.dir;app.lang=t.htmlLang;
  const groups=GROUPS.map(([g,ks])=>{
    const vis=ks.filter(k=>!(k==='husband'&&S.sex==='M')&&!(k==='wife'&&S.sex==='F'));
    const rows=vis.map(rowHTML).join('');
    if(g==='far'){
      const open=ks.some(k=>S.n[k]>0)?' open':'';
      return `<details class="far"${open}><summary>${t.g.far}</summary><p class="hint">${t.farHint}</p><div class="heirs">${rows}</div></details>`;
    }
    return `<div class="group-title">${t.g[g]}</div><div class="heirs">${rows}</div>`;
  }).join('');
  const sexBtn=(v,label,icon)=>`<button type="button" class="gender-option${S.sex===v?' selected':''}" data-act="sex" data-v="${v}" aria-pressed="${S.sex===v}"><span class="gender-icon" aria-hidden="true">${icon}</span><strong>${label}</strong></button>`;
  const L=LET[S.lang];
  app.innerHTML=`
  <div class="letterhead print-only"><div class="lh-brand"><img class="lh-logo" src="icons/jamia-logo.png" alt="" width="46" height="46"><div class="lh-name">${L.n}</div></div><div class="lh-rule"></div><div class="lh-row"><span class="lh-title">${t.name} · ${t.res}</span><span class="lh-date"></span></div></div>
  <header class="hero"><div class="hero-content">
    <div class="topbar"><div class="logo logo-img"><img src="icons/jamia-logo.png" alt="${LET[S.lang].n}" width="80" height="80"></div>
      <nav class="lang-switch" role="group" aria-label="Language">${[['ur','اردو'],['ar','العربية'],['en','English'],['ro','Roman']].map(([v,l])=>`<button type="button" data-act="lang" data-v="${v}" aria-pressed="${S.lang===v}">${l}</button>`).join('')}</nav></div>
    <div class="eyebrow">${KICK[S.lang]}</div>
    <h1>${t.name}</h1>
    ${(S.lang==='ur'||S.lang==='ar')?`<div class="english-name">I'ZAZ AL-MIRATH</div>`:''}
    <div class="hero-rule"></div>
  </div></header>
  ${S.demo?`<div class="demo" id="demo"><span>${t.demo}</span><button type="button" class="link" data-act="reset">${t.reset}</button></div>`:''}
  ${heading('01',t.s1,'pre')}
  <section class="card step pre"><div class="gender-grid" role="group">${sexBtn('M',t.male,'◈')}${sexBtn('F',t.female,'❋')}</div></section>
  ${heading('02',t.s2,'pre')}
  <section class="card step pre">${fldHTML('estate',t.estate)}<div class="input-grid">${fldHTML('funeral',t.funeral)}${fldHTML('debts',t.debts)}</div>${fldHTML('will',t.will)}</section>
  ${heading('03',t.s3,'pre')}
  <section class="card step pre">${groups}</section>
  <table class="pw" role="presentation"><thead><tr><td><div class="pw-h"></div></td></tr></thead><tfoot><tr><td><div class="pw-f"></div></td></tr></tfoot><tbody><tr><td><section id="result" aria-live="polite"></section></td></tr></tbody></table>
  <div class="letterfoot print-only"><div class="lf-rule"></div><div class="lf-name"><bdi>${L.m}</bdi></div><div class="lf-line"><bdi>${L.r}</bdi> · <bdi>${L.a}</bdi></div></div>
  <footer class="footer"><div class="credit-card"><span class="credit-label">${PROJ[S.lang][0]}</span><strong class="credit-name"><bdi>${PROJ[S.lang][1]}</bdi></strong><span class="credit-line"><bdi>${PROJ[S.lang][2]}</bdi></span></div><div class="credit-card"><span class="credit-label">${DEV[S.lang]}</span><strong class="credit-name"><bdi>${DEVN[S.lang]}</bdi></strong><span class="credit-line"><bdi dir="ltr">Awaisrahmanjadoon@gmail.com</bdi></span><span class="credit-line"><bdi dir="ltr">03139190497</bdi></span></div><p class="privacy"><a href="privacy.html">${x2.priv}</a></p></footer>
  <div class="sticky-bar"><div class="sticky-inner"><div class="sticky-info"><strong id="stkAmt"></strong><span>${t.dist}</span></div><button type="button" class="btn btn-primary" data-act="goresult">${x2.go}</button></div></div>`;
  renderResult();stampDate();
}

let lastText='';

function renderResult(){
  const t=T[S.lang],x2=X[S.lang];
  const r=calc(S.n,S.sex);
  const net=Math.max(0,S.estate-S.funeral-S.debts);
  const cap=Math.floor(net/3);
  const willAmt=Math.min(S.will,cap);
  const dist=net-willAmt;
  const hasMoney=S.estate>0;
  const lines=[];
  let html=heading('04',t.res);
  if(hasMoney){
    const parts=[[t.bTotal,fmt(S.estate)]];
    if(S.funeral)parts.push([t.bFuneral,'− '+fmt(S.funeral)]);
    if(S.debts)parts.push([t.bDebts,'− '+fmt(S.debts)]);
    if(willAmt)parts.push([t.bWill,'− '+fmt(willAmt)]);
    html+=`<div class="result-hero"><div class="label">${t.dist}</div><div class="amount">${fmt(dist)}</div><div class="result-summary">${parts.map(([a,b])=>`<div><small>${a}</small><strong>${b}</strong></div>`).join('')}</div></div>`;
    if(S.will>cap)html+=`<div class="warnbox">${t.willWarn}</div>`;
    lines.push(`${t.dist}: ${fmt(dist)}`);
  }else html+=`<div class="result-hero"><div class="label">${t.needEstate}</div></div>`;
  const sa=$('#stkAmt');if(sa)sa.textContent=hasMoney?fmt(dist):'—';
  if(!r.empty){
    html+=`<p class="parts">${t.parts(r.N)}</p>`;
    html+=`<div class="share-bar" role="img" aria-label="${t.res}">${r.rows.map((x,i)=>`<span style="flex:${x.share.n/x.share.d} 1 0;background:var(--c${i%6})"></span>`).join('')}</div>`;
    html+=`<div class="legend">${r.rows.map((x,i)=>`<span><i class="dot" style="background:var(--c${i%6})"></i>${t.k[x.k]}</span>`).join('')}</div>`;
    html+=r.rows.map((x,i)=>{
      const pct=x.share.n/x.share.d*100;
      const amt=dist*x.share.n/x.share.d;
      const per=amt/x.count;
      const frac=`${x.share.n}/${x.share.d}`;
      lines.push(`${t.k[x.k]}${x.count>1?' x'+x.count:''}: ${frac}${hasMoney?' = '+fmt(amt):''}`);
      const cls=x.how==='f'?'tag-fard':x.how==='r'?'tag-radd':'tag-asaba';
      const third=(x.count>1&&hasMoney)?`<div><small>${t.each}</small><strong>${fmt(per)}</strong></div>`:`<div><small>%</small><strong>${pct.toFixed(1)}</strong></div>`;
      return `<section class="card heir-card"><div class="heir-card-top"><div><h3>${t.k[x.k]}${x.count>1?` <span class="cnt">× ${x.count}</span>`:''}</h3><span class="type-tag ${cls}">${t.how[x.how]}</span></div><div class="fraction">${frac}</div></div><div class="heir-data"><div><small>${x2.amtL}</small><strong>${hasMoney?fmt(amt):'—'}</strong></div><div><small>${t.unit}</small><strong>${x.parts}</strong></div>${third}</div>${dalilHtml(x,S.n)}</section>`;
    }).join('');
  }
  if(!r.empty&&r.rows.some(x=>x.count>1)){
    const lcm=(a,b)=>a/gcd(a,b)*b;
    const fac=r.rows.reduce((l,x)=>lcm(l,x.count/gcd(x.parts,x.count)),1);
    const TT=r.N*fac;
    html+=`<section class="card"><h3 class="card-title">${x2.tashihT}</h3><p style="margin:0;font-size:13px">${x2.tashih(TT)}</p><div class="table-wrap"><table class="tashih-table"><thead><tr><th>${x2.th[0]}</th><th>${x2.th[1]}</th><th>${x2.th[2]}</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${t.k[x.k]}</td><td>${x.count}</td><td>${x.parts*fac/x.count} / ${TT}</td></tr>`).join('')}</tbody></table></div></section>`;
    lines.push(x2.tashih(TT));
    r.rows.forEach(x=>lines.push(`${t.k[x.k]}: ${x.parts*fac/x.count} / ${TT}`));
  }
  if(r.blocked.length)html+=`<section class="card"><h3 class="card-title">${t.blockedT}</h3><div class="blocked-list">${r.blocked.map(b=>`<div class="blocked-item"><b>${t.k[b.k]}</b><span>${t.why[b.why]}</span></div>`).join('')}</div></section>`;
  if(r.notes.length)html+=`<section class="card"><h3 class="card-title">${t.notesT}</h3><ul>${r.notes.map(x=>`<li>${t.n[x.c](x.p||{})}</li>`).join('')}</ul></section>`;
  if(!r.empty)html+=`<section class="card noprint"><div class="actions"><button type="button" class="btn btn-primary" data-act="copy">${t.copy}</button><button type="button" class="btn btn-gold" data-act="share">${x2.share}</button><button type="button" class="btn" data-act="print">${x2.print}</button><span id="cstatus" role="status"></span></div><textarea id="copybox" readonly hidden aria-label="${t.copy}"></textarea></section>`;
  lastText=lines.join('\n');
  $('#result').innerHTML=html;
}

function touched(){if(S.demo){S.demo=false;const d=$('#demo');if(d)d.remove();}}
function reset(){
  S.sex='M';S.estate=0;S.funeral=0;S.debts=0;S.will=0;S.n=blankN();S.demo=false;render();
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,t=T[S.lang];
  if(a==='step'){
    const k=b.dataset.k;
    S.n[k]=Math.min(MAXN[k]??30,Math.max(0,S.n[k]+Number(b.dataset.d)));
    $('#v-'+k).textContent=S.n[k];$('#r-'+k).classList.toggle('on',S.n[k]>0);touched();renderResult();
  }else if(a==='sex'){
    if(S.sex===b.dataset.v)return;
    S.sex=b.dataset.v;
    if(S.sex==='F'){S.n.wife=0;S.n.husband=1;}else{S.n.husband=0;S.n.wife=1;}
    touched();render();
  }else if(a==='lang'){
    S.lang=b.dataset.v;try{localStorage.setItem('miras-lang',S.lang);}catch(err){}
    render();
  }else if(a==='reset'){reset();}
  else if(a==='goresult'){$('#result').scrollIntoView({behavior:'smooth'});}
  else if(a==='print'){window.print();}
  else if(a==='share'){
    const msg=`${t.name}\n\n${lastText}\n\n${PROJ[S.lang][1]}`;
    window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener');
  }
  else if(a==='copy'){
    const st=$('#cstatus'),box=$('#copybox');
    const fallback=()=>{box.hidden=false;box.value=lastText;box.focus();box.select();st.textContent=t.copyFail;};
    try{
      navigator.clipboard.writeText(lastText).then(()=>{st.textContent=t.copied;},fallback);
    }catch(err){fallback();}
  }
});
app.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.num)return;
  const digits=el.value.replace(/\D/g,'').slice(0,12);
  if(digits!==el.value)el.value=digits;
  S[el.id]=Number(digits)||0;
  const h=$('#h-'+el.id);if(h)h.textContent=S[el.id]?fmt(S[el.id]):'';
  touched();renderResult();
});
render();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
